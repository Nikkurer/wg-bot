# wg-bot на RU-сервере. Требует запущенный wg-admin (systemd на хосте).
#
# Подготовка на хосте:
#   sudo groupadd -f wg-admin
#   sudo mkdir -p /var/lib/wg/clients /var/lib/wg/bot /etc/wg-bot
#   sudo cp config.yaml.example /etc/wg-bot/config.yaml   # отредактировать
#   sudo cp env.example .env && edit .env               # TELEGRAM_TOKEN, WG_ADMIN_GID, HOST_*
#   sudo chown -R 1000:1000 /var/lib/wg/clients /var/lib/wg/bot
#
# Запуск:
#   docker compose up -d --build

services:
  wg-bot:
    build:
      context: .
      # DNS хоста: на некоторых VPS bridge-сеть Docker не резолвит deb.debian.org
      network: host
    image: wg-bot:latest
    container_name: wg-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:?set TELEGRAM_TOKEN in .env}
      WGBOT_LOG_DIR: /app/state
    group_add:
      - "${WG_ADMIN_GID:?set WG_ADMIN_GID in .env}"
    volumes:
      # wg-admin Unix socket (read-only); HOST_* — путь на хосте
      - ${HOST_WG_ADMIN_SOCKET_DIR:-${WG_ADMIN_SOCKET_DIR:-/run/wg-admin}}:/run/wg-admin:ro
      - ${HOST_CLIENT_DIR:-${CLIENT_DIR:-/var/lib/wg/clients}}:/var/lib/wg/clients
      - ${HOST_BOT_STATE_DIR:-${BOT_STATE_DIR:-./state}}:/app/state
      # Каталог с config.yaml на хосте (не mount файла — иначе Docker создаст пустой каталог)
      - ${HOST_CONFIG_DIR:-${CONFIG_DIR:-.}}:/config:ro
    command: ["python", "main.py", "-c", "/config/config.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/wg-admin/wg-admin.sock"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
